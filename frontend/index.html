<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Extintores</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Control de Extintores</h1>
        <p>Registro y control de extintores</p>

        <div id="barra-sesion" hidden>
            <span id="usuario-actual"></span>
            <button type="button" id="boton-salir">Cerrar sesión</button>
        </div>
    </header>

    <!-- LOGIN -->
    <main id="pantalla-login">
        <section>
            <h2>Iniciar sesión</h2>

            <form id="form-login">

                <label for="login-usuario">Usuario</label>
                <input type="text" id="login-usuario" autocomplete="username" required>

                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" autocomplete="current-password" required>

                <button type="submit" id="boton-entrar">
                    Entrar
                </button>

            </form>

            <p id="mensaje-login"></p>

            <p class="cambiar-pantalla">
                ¿No tienes cuenta?
                <a href="#" id="ir-a-registro">Crear cuenta</a>
            </p>
        </section>
    </main>

    <!-- REGISTRO -->
    <main id="pantalla-registro" hidden>
        <section>
            <h2>Crear cuenta</h2>

            <form id="form-registro">

                <label for="registro-usuario">Usuario</label>
                <input type="text" id="registro-usuario" autocomplete="username"
                    placeholder="Ej: juan.perez" minlength="3" maxlength="30"
                    pattern="[A-Za-z0-9._\-]+"
                    title="Solo letras, números, punto, guion o guion bajo (sin espacios ni tildes)"
                    required>

                <label for="registro-email">Correo electrónico</label>
                <input type="email" id="registro-email" autocomplete="email"
                    placeholder="Aquí te llegarán las notificaciones" maxlength="254" required>

                <label for="registro-password">Contraseña</label>
                <input type="password" id="registro-password" autocomplete="new-password"
                    placeholder="Mínimo 8 caracteres" minlength="8" required>

                <label for="registro-password2">Repetir contraseña</label>
                <input type="password" id="registro-password2" autocomplete="new-password"
                    minlength="8" required>

                <button type="submit" id="boton-registrar">
                    Crear cuenta
                </button>

            </form>

            <p id="mensaje-registro"></p>

            <p class="cambiar-pantalla">
                ¿Ya tienes cuenta?
                <a href="#" id="ir-a-login">Iniciar sesión</a>
            </p>
        </section>
    </main>

    <!-- SISTEMA (solo con sesión iniciada) -->
    <main id="pantalla-app" hidden>

        <!-- FORMULARIO -->
        <section>
            <h2>Agregar extintor</h2>

            <form id="form-extintor">

                <label>Código</label>
                <input type="text" id="codigo" placeholder="Ej: EXT-002" required>

                <label>Tipo</label>
                <input type="text" id="tipo" list="tipos-extintor" maxlength="50"
                       placeholder="Ej: Polvo químico seco (PQS)">
                <datalist id="tipos-extintor">
                    <option value="Polvo químico seco (PQS)">
                    <option value="CO2">
                    <option value="Agua">
                    <option value="Espuma (AFFF)">
                    <option value="Acetato de potasio (Clase K)">
                </datalist>

                <label>Ubicación</label>
                <input type="text" id="ubicacion" placeholder="Ej: Casa" required>

                <label>Capacidad (kg)</label>
                <input type="number" id="capacidad" step="0.1">

                <label>Fecha de vencimiento</label>
                <input type="date" id="fecha_vencimiento" required>

                <label>Prueba hidrostática</label>
                <input type="date" id="ultima_mantencion">

                <label>Observaciones</label>
                <textarea id="observaciones" placeholder="Ej: Sin daños"></textarea>

                <button type="submit">
                    Agregar extintor
                </button>

            </form>

            <p id="mensaje"></p>

        </section>


        <!-- LISTA DE EXTINTORES -->
        <section>
            <h2>Mis extintores</h2>

            <div id="lista-extintores">
                Cargando extintores... (la primera carga puede tardar hasta 1 minuto mientras el servidor despierta)
            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
