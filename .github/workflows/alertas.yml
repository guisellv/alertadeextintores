name: Alertas de extintores

on:
  schedule:
    # Hora en UTC (tu hora + 4). 21:05 UTC = 5:05 de la tarde.
    # Avisos de vencimiento: todos los días
    - cron: '5 21 * * *'
    # Resumen mensual: el día 1 de cada mes
    - cron: '10 21 1 * *'
  # Permite ejecutarlo a mano desde la pestaña Actions (botón "Run workflow")
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Qué enviar'
        type: choice
        options:
          - avisos
          - resumen
          - nuevos
        default: avisos

# Nombre que se ve en la pestaña Actions
run-name: "Alertas de extintores (${{ github.event.schedule == '10 21 1 * *' && 'resumen' || inputs.tipo || 'avisos' }})"

# Si se agregan varios extintores seguidos, los envíos se hacen de a uno
# (así nunca llega el mismo aviso dos veces).
concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Revisar extintores y enviar correo
        run: npm run alertas
        env:
          # "resumen" si lo lanzó el horario del día 1;
          # "nuevos" si lo pidió el servidor al agregar un extintor;
          # si no, lo que elegiste a mano (o "avisos" en la revisión diaria)
          TIPO_AVISO: ${{ github.event.schedule == '10 21 1 * *' && 'resumen' || inputs.tipo || 'avisos' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALERTA_EMAIL_DESTINO: ${{ secrets.ALERTA_EMAIL_DESTINO }}
